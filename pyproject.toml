[project]
name = "point-cloud-defect-inspection"
version = "1.0.0"
requires-python = ">=3.10,<3.13"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests (registration on 100k+ points)"]
